name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project
        run: ./gradlew check --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :app:android:assembleDebug --stacktrace

      - name: Compile desktop app
        run: ./gradlew :app:desktop:compileKotlin --stacktrace

      - name: Compile developer CLI
        run: ./gradlew :tools:dev-cli:installDist --stacktrace
